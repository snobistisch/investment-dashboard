name: Refresh crypto decision data

on:
  schedule:
    # CoinGecko's last completed UTC day is available shortly after 00:35.
    # 01:15 UTC leaves margin while still refreshing before a European morning.
    - cron: '15 1 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-crypto-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-crypto-market
      - run: npm run fetch-risk-rating
      - run: npm run build-portfolio
      - run: npm run verify
      - run: npm run lint
      - run: npm run build

      - id: commit
        run: |
          set -euo pipefail
          FILES=(
            public/data/crypto-market.json
            public/data/crypto-history.json
            public/data/risk-rating.json
            public/data/portfolio.json
            public/dashboards/crypto.html
            public/dashboards/portfolio.html
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No crypto decision data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Refresh crypto decision data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}

